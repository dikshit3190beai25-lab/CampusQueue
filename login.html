<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — CampusQueue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/login.css">
</head>
<body data-theme="dark" class="auth-body">

  <div class="auth-card">
    <a href="index.html" class="auth-brand" aria-label="CampusQueue home">
      <div class="brand-mark">CQ</div>
      <div class="brand-name">CampusQueue</div>
    </a>

    <div class="auth-heading">Welcome back</div>
    <div class="auth-sub">Log in to see your tasks, grades, and schedule.</div>

    <div class="form-error" id="formError"></div>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@campus.edu" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <div class="password-field">
          <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
          <button type="button" class="password-toggle-btn" data-toggle-for="password" aria-label="Show password" title="Show password">
            <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a19.9 19.9 0 0 1 5.06-5.94M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a19.9 19.9 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
      </div>

      <div class="field">
        <label for="captchaInput">
          <span>Verification Code</span>
          <span style="font-size:11px; font-weight:500; color:var(--text-3);">Click image to refresh</span>
        </label>
        <div class="captcha-container">
          <div class="captcha-display-row">
            <div class="captcha-canvas-wrap" title="Click to refresh CAPTCHA code">
              <canvas id="captchaCanvas" width="220" height="44" class="captcha-canvas" aria-label="Captcha security code"></canvas>
            </div>
            <button type="button" class="captcha-refresh-btn" id="captchaRefreshBtn" title="Generate new code" aria-label="Refresh captcha">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
              </svg>
            </button>
          </div>
          <div class="captcha-input-wrap">
            <input type="text" id="captchaInput" name="captcha" placeholder="Enter the code above" maxlength="6" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" required>
          </div>
        </div>
        <div class="field-hint">Enter the characters shown above to verify you're not a robot.</div>
      </div>

      <button type="submit" class="auth-submit" id="submitBtn">Log in</button>
    </form>

    <div class="auth-alt">Don't have an account? <a href="signup.html">Sign up</a></div>
  </div>

<script src="js/common.js"></script>
<script src="js/auth.js"></script>
<script src="js/login.js"></script>
<script src="js/effects.js"></script>
</body>
</html>
